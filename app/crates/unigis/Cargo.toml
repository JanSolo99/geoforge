[package]
name = "rustgis-unigis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniGIS's ArcGIS-verified geoprocessing tools (unigis-tools) as UniGIS tools"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
rustgis-data = { workspace = true }
rustgis-analysis = { workspace = true }
serde_json = { workspace = true }
unigis-core = { path = "../../../crates/unigis-core" }
unigis-raster = { path = "../../../crates/unigis-raster" }
unigis-geometry = { path = "../../../crates/unigis-geometry" }
unigis-tools = { path = "../../../crates/unigis-tools", default-features = false }

# PROJ (Geodetic Densify, Convert Coordinate Notation, Table To Ellipse) on the desktop only: the
# browser build has no C toolchain for it. The app's rusqlite stays on the libsqlite3-sys that
# proj-sys links (one `links = "sqlite3"` crate per build).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unigis-tools = { path = "../../../crates/unigis-tools", features = ["proj", "gdb"] }
