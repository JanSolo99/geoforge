[package]
name = "rustgis-map"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniGIS L2: maps, layers, symbology, labeling, camera and basemaps"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
rustgis-data = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
web-time = { workspace = true }
proj4rs = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }
# Local views (`local:lon,lat`, map.viewMode "local") are azimuthal equidistant, computed in
# `projection.rs` on GeographicLib's pure-Rust geodesics: proj4rs' `aeqd` is C, which the browser
# can't build and whose `geod_*` symbols clash with PROJ's (linked by UniGIS's tools) on the desktop.
geographiclib-rs = { workspace = true }
