[package]
name = "unigis-filegdb"
description = "Esri File Geodatabase (.gdb) reader and writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
unigis-core.workspace = true
thiserror.workspace = true
chrono.workspace = true
roxmltree.workspace = true
flate2.workspace = true
# JPEG-compressed raster blocks (pure Rust, so the browser build reads them too).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
# JPEG 2000-compressed raster blocks (pure Rust).
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }

# The clock in the browser (std's panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[lints]
workspace = true

[dev-dependencies]
unigis-testkit.workspace = true
serde_json.workspace = true
