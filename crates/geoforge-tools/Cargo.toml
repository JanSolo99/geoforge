[package]
name = "geoforge-tools"
description = "Geoprocessing tools with ArcGIS Pro semantics (Clip, Buffer, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
geoforge-core.workspace = true
geoforge-geometry.workspace = true
geoforge-proj = { workspace = true, optional = true }
rstar.workspace = true

[features]
default = ["proj"]
# Project (needs PROJ). The RustGIS app builds without it: PROJ's build pins an older SQLite
# binding than the app's.
proj = ["dep:geoforge-proj"]

[lints]
workspace = true
