[package]
name = "unigis-tools"
description = "Geoprocessing tools with ArcGIS Pro semantics (Clip, Buffer, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
roxmltree.workspace = true
unigis-core.workspace = true
unigis-geometry.workspace = true
unigis-proj = { workspace = true, optional = true }
rstar.workspace = true
spade.workspace = true
calamine = { version = "0.37", features = ["chrono"] }

[features]
default = ["proj"]
# Project (needs PROJ). The RustGIS app builds without it: PROJ's build pins an older SQLite
# binding than the app's.
proj = ["dep:unigis-proj"]

[lints]
workspace = true
