name: CI

# Every push to main, as a second opinion on the local gate (scripts/check, run by the pre-push
# hook and by `scripts/lane land`). Actions minutes are free for this public repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GDAL (test oracle)
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libsqlite3-dev sqlite3 cmake  # cmake + sqlite: proj-sys builds PROJ >= 9.6.2 from source when the system one is older
      - name: Fetch test corpora
        run: scripts/fetch-testdata.sh
      - run: python3 -m unittest discover -s scripts/dashboard -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
