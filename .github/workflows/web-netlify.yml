name: Deploy web app to Netlify

# Every push to main (Actions minutes are free for this public repository); also by hand.
# The newest push wins: an older build still running is cancelled.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-netlify
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    # Pinned: the browser gate's Playwright (scripts/readiness, 1.56.1) supports Ubuntu 24.04 but
    # not 26.04, which ubuntu-latest became. Move both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Needs the repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID (see docs/WEB.md).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install Trunk
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        run: scripts/build-web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/readiness/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/readiness
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser workflow gate
        run: node scripts/readiness/browser.cjs --dist app/dist/web --report browser-readiness.json --screenshot browser-readiness.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-readiness
          path: |
            browser-readiness.json
            browser-readiness.png
      - name: Publish the built site to the web-dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sed 's|publish = "app/dist/web"|publish = "."|' netlify.toml > app/dist/web/netlify.toml
          cd app/dist/web
          git init -q -b web-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-dist
      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are not set (docs/WEB.md); built but not deployed."
            exit 0
          fi
          scripts/deploy-netlify.sh --prod --message "${GITHUB_SHA::7}"
