[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
unigis-core = { path = "crates/unigis-core" }
unigis-shapefile = { path = "crates/unigis-shapefile" }
unigis-filegdb = { path = "crates/unigis-filegdb" }
unigis-proj = { path = "crates/unigis-proj" }
unigis-raster = { path = "crates/unigis-raster" }
unigis-testkit = { path = "crates/unigis-testkit" }
unigis-geometry = { path = "crates/unigis-geometry" }
unigis-tools = { path = "crates/unigis-tools" }
unigis-json = { path = "crates/unigis-json" }
unigis-csv = { path = "crates/unigis-csv" }
unigis-gpkg = { path = "crates/unigis-gpkg" }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
geo = { version = "0.33", default-features = false }
rstar = "0.12"
spade = "2.15"
i_overlay = { version = "4.5", default-features = false }
proj = { version = "0.31", default-features = false }
proj-sys = { version = "0.27", default-features = false }
tiff = "0.11"
weezl = "0.1"
flate2 = "1"
approx = "0.5"
geographiclib-rs = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
